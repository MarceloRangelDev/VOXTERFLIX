{% extends "base.html" %}
{% block titulo %}Entrar — VoxterFlix{% endblock %}
{% block conteudo %}
<div class="container">
  <div class="voxter-card voxter-card-narrow">
    <h1 class="h3 mb-4 text-center">Entrar</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert voxter-alert voxter-alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}
      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}">Usuário</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label for="{{ form.password.id_for_label }}">Senha</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <button type="submit" class="btn voxter-btn-primary w-100 mb-3">Entrar</button>
    </form>
    <div class="d-flex justify-content-between small">
      <a href="{% url 'accounts:password_reset' %}">Esqueci minha senha</a>
      <a href="{% url 'accounts:signup' %}">Criar conta</a>
    </div>
  </div>
</div>
{% endblock %}

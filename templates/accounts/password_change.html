{% extends "base.html" %}
{% block titulo %}Alterar senha — VoxterFlix{% endblock %}
{% block conteudo %}
<div class="container">
  <div class="voxter-card voxter-card-narrow">
    <h1 class="h3 mb-4 text-center">Alterar senha</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn voxter-btn-primary w-100">Salvar nova senha</button>
    </form>
  </div>
</div>
{% endblock %}

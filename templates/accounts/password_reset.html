{% extends "base.html" %}
{% block titulo %}Recuperar senha — VoxterFlix{% endblock %}
{% block conteudo %}
<div class="container">
  <div class="voxter-card voxter-card-narrow">
    <h1 class="h3 mb-3 text-center">Recuperar senha</h1>
    <p class="text-muted small mb-4">Informe seu e-mail. Se houver uma conta cadastrada, enviaremos um link para redefinir a senha.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="{{ form.email.id_for_label }}">E-mail</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn voxter-btn-primary w-100">Enviar link de recuperação</button>
    </form>
  </div>
</div>
{% endblock %}

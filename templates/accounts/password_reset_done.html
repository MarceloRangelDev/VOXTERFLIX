{% extends "base.html" %}
{% block titulo %}Verifique seu e-mail — VoxterFlix{% endblock %}
{% block conteudo %}
<div class="container">
  <div class="voxter-card voxter-card-narrow text-center">
    <i class="bi bi-envelope-check display-4 text-info mb-3"></i>
    <h1 class="h4 mb-3">Verifique seu e-mail</h1>
    <p class="text-muted small">Se existir uma conta com o e-mail informado, você receberá um link para redefinir sua senha em alguns minutos.</p>
    <a href="{% url 'accounts:login' %}" class="btn voxter-btn-outline mt-2">Voltar ao login</a>
  </div>
</div>
{% endblock %}

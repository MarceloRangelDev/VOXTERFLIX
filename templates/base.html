{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}VoxterFlix{% endblock %}</title>
  <meta name="description" content="VoxterFlix — catálogo de filmes e séries desenvolvido como teste técnico.">

  <!-- Bootstrap 5 e Bootstrap Icons via CDN: evita depender de Node.js/bundlers para um projeto simples de instalar. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/netflix.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "includes/navbar.html" %}

  <main id="conteudo-principal">
    {% include "includes/messages.html" %}
    {% block conteudo %}{% endblock %}
  </main>

  {% include "includes/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>

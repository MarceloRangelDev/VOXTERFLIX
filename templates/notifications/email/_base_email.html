{% comment %}
Layout base para todos os e-mails transacionais do VoxterFlix.
Usa CSS inline porque a maioria dos clientes de e-mail ignora <style> em <head>.
{% endcomment %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxterFlix</title>
</head>
<body style="margin:0;padding:0;background-color:#07111F;font-family:Segoe UI,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#07111F;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#0D1B2A;border-radius:12px;overflow:hidden;border:1px solid #243B53;">
          <tr>
            <td style="background:linear-gradient(90deg,#0066FF,#00AEEF);padding:24px 32px;">
              <span style="color:#FFFFFF;font-size:24px;font-weight:800;letter-spacing:0.5px;">VOXTERFLIX</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#FFFFFF;font-size:15px;line-height:1.6;">
              {% block conteudo %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background-color:#07111F;color:#A8B6C7;font-size:12px;">
              Este é um e-mail automático do VoxterFlix, projeto fictício desenvolvido para um teste técnico.
              Se você não reconhece esta ação, ignore esta mensagem.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
